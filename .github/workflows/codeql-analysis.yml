name: CodeQL

on:
  push:
    branches:
      - main
  schedule:
    - cron: 0 0 1 * 0
      timezone: Asia/Ho_Chi_Minh
  pull_request:
    branches:
      - main
    paths-ignore:
      - '**/*.md'
      - .github/*
      - .devcontainer/*
      - .vscode/*
jobs:
  analyze:
    name: Analyze
    runs-on:
      - ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: javascript-typescript
            build-mode: none
    steps:
      - uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20.x
          check-latest: true

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: '${{ matrix.language }}'
          build-mode: '${{ matrix.build-mode }}'
          config: |
            paths-ignore:
              - '**/node_modules'               

      - run: 'npm ci --no-audit --no-progress'

      - run: 'npm run init:ci'

      - run: 'npm run build:ci'
      
      - name: Initialize CodeQL
        uses: github/codeql-action/analyze@v4
        with:
          category: '/language:${{ matrix.language }}'
