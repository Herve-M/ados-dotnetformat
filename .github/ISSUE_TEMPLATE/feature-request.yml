name: Feature Request
description: Suggest an idea or enhancement.
title: "[Feature]: "
labels: ["enhancement", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to suggest a feature!
  - type: dropdown
    id: task
    attributes:
      label: Task in Question
      description: Which task is this feature request for?
      options:
        - UseDotNetFormat
        - DotNetFormatCLI
        - ReportReviewer
    validations:
      required: true
  - type: textarea
    id: request
    attributes:
      label: Request
      description: Describe the feature you would like to see.
      placeholder: Share your request in as much detail as needed.
    validations:
      required: true
