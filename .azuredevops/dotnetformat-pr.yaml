trigger: none

pr:
  branches:
    include:
    - main
    - releases/*

name: dotnetformat-extensions-PR

pool:
  vmImage: 'ubuntu-latest'

variables:
  nodeJsVersionSpec: '20.x'
  tfxCliVersionSpec: '0.22.x'

stages:
  - stage:
    jobs:
      - job:
        steps:
          - task: UseNode@1
            displayName: 'Install Node.js'
            inputs:
              version: '$(nodeJsVersionSpec)'            

          - task: TfxInstaller@5
            inputs:
              version: '$(tfxCliVersionSpec)'
              checkLatest: true

          - task: Npm@1
            displayName: 'npm base init'
            inputs:
              command: custom
              verbose: false
              customCommand: 'install npm ci --no-audit --no-progress'

          - task: Npm@1
            displayName: 'Init'
            inputs:
              command: custom
              verbose: false
              workingDir: '$(System.DefaultWorkingDirectory)'
              customCommand: 'run init:ci'

          - task: Npm@1
            displayName: 'Build'
            inputs:
              command: custom
              verbose: false
              workingDir: '$(System.DefaultWorkingDirectory)'
              customCommand: 'run build:ci'

          - task: Npm@1
            displayName: 'Test'
            inputs:
              command: custom
              verbose: false
              workingDir: '$(System.DefaultWorkingDirectory)'
              customCommand: 'run test:ci'

          - task: PackageAzureDevOpsExtension@5
            displayName: 'Pack extension'
            name: 'packageStep'
            inputs:
              rootFolder: '$(System.DefaultWorkingDirectory)'
              outputPath: '$(Build.ArtifactStagingDirectory)/dist/dotnetformat-extension-pr.vsix'
              extensionVisibility: private